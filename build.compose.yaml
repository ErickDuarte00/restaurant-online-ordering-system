services:
  frontend-build:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/build.Dockerfile
    ports:
      - "8080:8080"

  db:
    restart: always
    image: postgres:17
    environment:
      PGDATABASE: ${DATABASE_NAME:-restaurant_db}
      PGUSER: ${DATABASE_USERNAME:-restaurant_user}
      PGPASSWORD: ${DATABASE_PASSWORD:-restaurant_password}
      POSTGRES_DB: ${DATABASE_NAME:-restaurant_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-restaurant_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-restaurant_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false

  backend-build:
    build:
      context: ./backend
      dockerfile: ../docker/backend/build.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-prod-secret-key-12345}
      DEBUG: ${DEBUG:-False}
      DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL:-info}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DATABASE_ENGINE: ${DATABASE_ENGINE:-postgresql}
      DATABASE_NAME: ${DATABASE_NAME:-restaurant_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-restaurant_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-restaurant_password}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_...}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_...}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_...}
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false

volumes:
  postgres_data:
